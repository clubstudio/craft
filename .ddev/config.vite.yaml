# Exposes the Vite dev server (`ddev npm run dev`) on port 5173 for HMR.
# Shipped with the boilerplate so there's no DDEV config to edit by hand.
# DDEV merges every .ddev/config.*.yaml file, and this partial carries no
# project-specific values, so it's safe to keep committed.
web_extra_exposed_ports:
    - name: vite
      container_port: 5173
      http_port: 5172
      https_port: 5173
